    "confidence_level": 0.95,
    "multiple_testing": "benjamini_hochberg",
    "fdr_q": 0.05,
    "report_all_seeds": true
  },
  "test_threshold_source": "ddr_validation_only",
  "external_test_access": "locked_until_freeze_manifest",
