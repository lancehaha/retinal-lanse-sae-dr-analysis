{
  "protocol_version": "0.1",
  "candidate_limit_per_branch_per_concept": 25,
  "evidence_sampling": {"top": 50, "medium": 20, "matched_negative": 50},
  "primary_concepts": ["hemorrhage", "hard_exudate", "soft_exudate", "microaneurysm"],
